<text x="30" y="295" fill="#cfe7dc" font-family="sans-serif" font-size="18">22 × 8 outside / 20 × 6 opening</text>
<text x="30" y="320" fill="#9aaebc" font-family="sans-serif" font-size="13">Survival: generated Ancient City, Overworld</text>
<text x="30" y="345" fill="#9aaebc" font-family="sans-serif" font-size="13">Creative: matching replicas also work</text>
<text x="30" y="370" fill="#9aaebc" font-family="sans-serif" font-size="13">Step away or release the shard and the awakening fades</text>
<text x="30" y="395" fill="#9aaebc" font-family="sans-serif" font-size="13">No shard is consumed by a cancelled awakening</text>
<text x="508" y="180" fill="#8cd7c9" font-family="sans-serif" font-size="40">→</text>
<text x="570" y="150" fill="#b0e4d0" font-family="sans-serif" font-size="24">NULL REALM</text>
<text x="570" y="176" fill="#9aaebc" font-family="sans-serif" font-size="13">Matching 22 × 8 return gateway at the sanctuary</text>
<text x="570" y="201" fill="#9aaebc" font-family="sans-serif" font-size="14">Sanctuary → wilds → Null Warden</text>
<text x="570" y="232" fill="#a9d8b0" font-family="sans-serif" font-size="13">Two bells → Rootbound Prior → Briarbrand</text>
<text x="570" y="266" fill="#d3bd88" font-family="sans-serif" font-size="18">↓ First Warden victory</text>
<text x="570" y="311" fill="#d4b18c" font-family="sans-serif" font-size="24">HOLLOW KEEP</text>
<text x="570" y="339" fill="#9aaebc" font-family="sans-serif" font-size="14">Three wards → Grave Regent → Requiem Glaive</text>
