<text x="390" y="369" fill="#e1c4a1" font-size="13">GRAVE REGENT</text><text x="390" y="393" fill="#ada0af" font-size="11">After all three wards</text>
<text x="230" y="486" fill="#716879" font-size="11">GRAVE GARDEN</text><text x="550" y="486" fill="#716879" font-size="11">GRAVE GARDEN</text>
