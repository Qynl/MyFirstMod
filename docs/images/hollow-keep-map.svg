<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 0 800 700" role="img" aria-labelledby="title desc">
<title id="title">Hollow Keep expedition map</title><desc id="desc">Schematic of the 63 by 63 fortress. Enter from the south, enroll at the heart, clear west, east and north ward chambers, then fight the Regent in the central hall. All interaction anchors are at Y 65.</desc>
