<text x="400" y="620" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#d6c7b6">GATHER → ENROLL → THREE WARDS → REGENT → RETURN FOR REWARDS</text>
<text x="400" y="646" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a699ad">One shared expedition. Clear wards in any order, one chamber at a time.</text>
