<g fill="#adccbf"><circle cx="170" cy="120" r="4"/><circle cx="610" cy="120" r="4"/><circle cx="170" cy="560" r="4"/><circle cx="610" cy="560" r="4"/></g>
<g font-family="sans-serif" text-anchor="middle">
<g fill="#e6d4bb" font-size="14"><text x="230" y="315">WEST WARD</text><text x="550" y="315">EAST WARD</text><text x="390" y="153">NORTH WARD</text></g>
<g fill="#b5a7b6" font-size="11"><text x="230" y="332">Sentinels</text><text x="550" y="332">Shardstalkers</text><text x="390" y="170">Mixed guardians</text></g>
