name: Build Mod

on:
  push:
    branches: ["main", "arena/e0119b17-myfirstmod"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Build
        run: gradle build

      - name: Boot smoke test (dedicated server)
        timeout-minutes: 20
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          {
            echo "level-type=minecraft\:flat"
            echo "view-distance=4"
            echo "simulation-distance=4"
            echo "online-mode=false"
            echo "sync-chunk-writes=false"
            echo "spawn-protection=0"
          } > run/server.properties
          ( sleep 45; echo "stop" ) | timeout 720 gradle runServer --console=plain > server.log 2>&1 || true
          echo "--- last 60 lines of server log ---"
          tail -60 server.log
          ok=1
          grep -q "myfirstmod" server.log || ok=0
          grep -q "Done (" server.log || ok=0
          modIssues=$(grep -iE "(error|failed|exception).*myfirstmod" server.log | grep -v "No data fixer" || true)
          if [ -n "$modIssues" ]; then
            printf '::warning title=Mod-related log lines::%s\n' "$(printf '%s' "$modIssues" | tail -c 2000 | tr '"' "'" | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          if [ "$ok" != "1" ]; then
            diag=$( { grep -A 40 "Registry loading errors" server.log; echo "===== generic errors ====="; grep -iE "error|exception|caused by" server.log | grep -v "^\s*at " | head -30; } | tr -d '\r' | tr '"' "'" | tail -c 2800 | sed ':a;N;$!ba;s/\n/%0A/g' )
            printf '::error title=Server smoke test failed::%s\n' "$diag"
            exit 1
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MyFirstMod
          path: build/libs/*.jar
