name: Build Mod

on:
  push:
    branches-ignore: []
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate assets
        run: python3 tools/validate_assets.py

      # `set -o pipefail` matters: without it `| tee` would swallow Gradle's
      # exit code and a broken build would look green.
      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace --console=plain 2>&1 | tee gradle.log

      # Compiler errors are packed into a single escaped annotation (plus the
      # log tail) so a failure is readable straight through the checks API.
      - name: Report build failure
        if: failure()
        run: |
          echo "=== gradle.log (tail) ==="
          tail -n 120 gradle.log
          echo "=== jars produced ==="
          find build -name '*.jar' 2>/dev/null | head -20 || true
          python3 - <<'PY'
          import re, pathlib
          log = pathlib.Path('gradle.log').read_text(errors='replace')
          lines = log.splitlines()
          pat = re.compile(r"^(\S+\.java):(\d+): (error|warning): (.*)$")
          blocks, i = [], 0
          while i < len(lines):
              if not pat.match(lines[i]):
                  i += 1
                  continue
              block = [lines[i]]
              j = i + 1
              while j < len(lines) and len(block) < 8 and lines[j].startswith('  '):
                  block.append(lines[j])
                  j += 1
              blocks.append("\n".join(block))
              i = j
          seen, uniq = set(), []
          for b in blocks:
              if b not in seen:
                  seen.add(b)
                  uniq.append(b)
          text = "\n".join(uniq)
          chunks = [text[k:k + 3500] for k in range(0, len(text), 3500)][:8]
          for n, chunk in enumerate(chunks, 1):
              esc = chunk.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::error title=Gradle errors {n}/{len(chunks)}::{esc}")
          print(f"::warning title=Gradle summary::{len(uniq)} diagnostics in {len(lines)} log lines")
          PY

      - name: Upload Gradle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log
          if-no-files-found: warn

      - name: Upload Mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fabricracers
          path: build/libs/*.jar
          if-no-files-found: error
