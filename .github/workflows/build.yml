name: Build Mod

on:
  push:
    branches-ignore: []
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate assets
        run: python3 tools/validate_assets.py

      # tee keeps the full compiler output; GitHub's default shell is
      # `bash -eo pipefail`, so a broken build still fails this step.
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace --console=plain 2>&1 | tee gradle.log

      # Compiler errors are surfaced as annotations so a build failure is
      # readable straight from the run summary.
      - name: Report build failure
        if: failure()
        run: |
          echo "=== gradle.log (tail) ==="
          tail -n 100 gradle.log
          echo "=== annotations ==="
          grep -aE "error:|Could not resolve|Could not find|Could not download|Could not get resource|What went wrong|Caused by:|FAILURE:" gradle.log \
            | head -50 | while IFS= read -r line; do
              echo "::error title=Gradle::${line}"
            done

      - name: Upload Gradle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log
          if-no-files-found: warn

      - name: Upload Mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fabricracers
          path: build/libs/*.jar
          if-no-files-found: error
