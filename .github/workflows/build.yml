name: Build Mod

on:
  push:
    branches: ["main", "arena/e0119b17-myfirstmod"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Build
        run: gradle build

      - name: Boot smoke test (dedicated server)
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          ( sleep 60; echo "stop"; sleep 600 ) | timeout 900 gradle runServer --console=plain > server.log 2>&1 || true
          echo "--- last 40 lines of server log ---"
          tail -40 server.log
          grep -q "myfirstmod" server.log
          grep -q "Done (" server.log

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MyFirstMod
          path: build/libs/*.jar
