name: Build Mod

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Mod with Gradle
        run: |
          gradle --version
          gradle build --stacktrace 2>&1 | tee gradle-build.log || BUILD_FAILED=1
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::notice file=build.gradle::$line"
          done < <(grep -E "(BUILD|Task|jar|Jar|compile|Compile|SUCCESS|FAILED|warning|error)" gradle-build.log | tail -n 25)
          if [ "$BUILD_FAILED" = "1" ]; then
            exit 1
          fi

      - name: Upload Mod JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegionsAndFactions-1.21.1
          path: build/libs/*.jar
