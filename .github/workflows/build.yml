name: Build Mod

on:
  push:
    branches-ignore: []
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate assets
        run: python3 tools/validate_assets.py

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace --console=plain > gradle.log 2>&1 || true
          tail -n 3 gradle.log

      # Compiler errors are surfaced as annotations so a build failure is
      # readable straight from the run summary.
      - name: Report build result
        if: steps.build.outcome == 'failure'
        run: |
          echo "=== gradle.log (tail) ==="
          tail -n 80 gradle.log
          echo "=== annotations ==="
          grep -aE "error:|Could not resolve|Could not find|Could not download|What went wrong|Caused by:|FAILURE:|A problem occurred" gradle.log \
            | head -40 | while IFS= read -r line; do
              echo "::error title=Gradle::${line}"
            done
          exit 1

      - name: Upload Mod JAR
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: fabricracers
          path: build/libs/*.jar
          if-no-files-found: error
