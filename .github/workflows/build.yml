name: Build Mod

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.12"

      - name: Validate generated resources
        run: python3 -m unittest discover -s tests -v

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --console=plain 2>&1 | tee ci-build.log

      - name: Report build diagnostics
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('ci-build.log')
          if p.exists():
              text = '\n'.join(p.read_text().splitlines()[-120:])
              escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Build diagnostics::{escaped}')
          PYCODE

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MyFirstMod
          path: build/libs/*.jar
