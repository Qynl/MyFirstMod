name: Build Mod

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Mod with Gradle
        run: |
          set -o pipefail
          gradle build --stacktrace 2>&1 | tee gradle-build.log || {
            echo "::error file=build.gradle::$(grep -A 10 -B 2 'FAILURE:' gradle-build.log | tr '\n' ' ')"
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error file=build.gradle::$line"
            done < <(grep -E '(: error:|cannot find symbol|does not exist|FAILURE|What went wrong:|Caused by:)' gradle-build.log | head -n 30)
            exit 1
          }

      - name: Upload Mod JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegionsAndFactions-1.21.1
          path: build/libs/*.jar
