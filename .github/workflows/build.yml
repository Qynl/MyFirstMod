name: Build Mod

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.12"

      - name: Validate generated resources
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee ci-resources.log

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --console=plain 2>&1 | tee ci-build.log

      - name: Dedicated server smoke test
        timeout-minutes: 10
        run: python3 scripts/ci_server_smoke.py

      - name: Report build diagnostics
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          for filename in ['ci-resources.log', 'ci-build.log', 'build/ci/server-smoke.log', 'build/ci/server-commands.log']:
              p = Path(filename)
              if p.exists():
                  text = p.read_text()
                  if filename == 'ci-build.log' and 'BUILD SUCCESSFUL' in text:
                      continue
                  text = text[-18000:]
                  for offset in range(0, len(text), 3000):
                      chunk = text[offset:offset+3000]
                      escaped = chunk.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f'::error title={filename} part {offset//3000+1}::{escaped}')
          PYCODE

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Null-Warden-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Validation-${{ github.sha }}
          path: |
            ci-resources.log
            ci-build.log
            build/ci/server-smoke.log
            build/ci/server-commands.log
            build/reports/tests/
          retention-days: 14
