name: Build Mod

on:
  push:
    branches-ignore: []
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate assets
        run: python3 tools/validate_assets.py

      # `set -o pipefail` matters: without it `| tee` would swallow Gradle's
      # exit code and a broken build would look green.
      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace --console=plain 2>&1 | tee gradle.log

      # Compiler errors are packed into a single escaped annotation (plus the
      # log tail) so a failure is readable straight through the checks API.
      - name: Report build failure
        if: failure()
        run: |
          echo "=== gradle.log (tail) ==="
          tail -n 120 gradle.log
          echo "=== jars produced ==="
          find build -name '*.jar' 2>/dev/null | head -20 || true
          python3 - <<'PY'
          import re, pathlib
          log = pathlib.Path('gradle.log').read_text(errors='replace')
          lines = log.splitlines()
          pat = re.compile(r"^(\S+\.java):(\d+): (error|warning): (.*)$")
          blocks, i = [], 0
          while i < len(lines):
              if not pat.match(lines[i]):
                  i += 1
                  continue
              block = [lines[i]]
              j = i + 1
              while j < len(lines) and len(block) < 8 and lines[j].startswith('  '):
                  block.append(lines[j])
                  j += 1
              blocks.append("\n".join(block))
              i = j
          seen, uniq = set(), []
          for b in blocks:
              if b not in seen:
                  seen.add(b)
                  uniq.append(b)
          text = "\n".join(uniq)
          chunks = [text[k:k + 3500] for k in range(0, len(text), 3500)][:8]
          for n, chunk in enumerate(chunks, 1):
              esc = chunk.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::error title=Gradle errors {n}/{len(chunks)}::{esc}")
          print(f"::warning title=Gradle summary::{len(uniq)} diagnostics in {len(lines)} log lines")
          PY

      - name: Upload Gradle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log
          if-no-files-found: warn

      - name: Upload Mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fabricracers
          path: build/libs/*.jar
          if-no-files-found: error

      # Actually boots a dedicated server with the mod installed: this loads the
      # datapack (recipes, tags, structures), the registries and the networking
      # wiring, which no amount of static checking can prove. Then it pokes the
      # mod through the console: list the stock circuits (reads the generated
      # .nbt structures), place modded blocks, spawn and inspect a car entity.
      - name: Server smoke test
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          cat > run/server.properties <<'PROPS'
          online-mode=false
          view-distance=4
          simulation-distance=4
          spawn-protection=0
          max-players=2
          motd=FabricRacers smoke test
          PROPS
          (
            sleep 90
            echo "race tracks"
            sleep 2
            echo "setblock 0 5 0 fabricracers:asphalt"
            sleep 1
            echo "setblock 2 5 0 fabricracers:boost_pad"
            sleep 1
            echo "setblock 4 5 0 fabricracers:checkpoint_marker"
            sleep 1
            echo "summon fabricracers:player_car 6 6 0"
            sleep 2
            echo "data get entity @e[type=fabricracers:player_car,limit=1]"
            sleep 2
            echo "kill @e[type=fabricracers:player_car]"
            sleep 2
            echo "stop"
          ) | timeout 600 ./gradlew runServer --no-daemon --console=plain > server.log 2>&1 || true
          echo "=== server.log tail ==="
          tail -n 80 server.log
          python3 - <<'PY'
          import re, pathlib
          log = pathlib.Path('server.log').read_text(errors='replace')
          ok = re.search(r'Done \([0-9.]+s\)! For help', log) is not None
          poked = 'fabricracers:asphalt' in log
          problems = [l for l in re.findall(
              r'^.*(?:ERROR|SEVERE|Exception|Caused by:|Failed to|Unknown or incomplete'
              r'|An unexpected error occurred).*$', log, re.M) if 'Ignoring' not in l][:60]
          head = ("server reached Done" if ok else "SERVER NEVER REACHED 'Done'") \
              + ("; console commands reached the mod" if poked else "; console commands did NOT run")
          esc = (head + "\n" + "\n".join(problems)).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f"::{'notice' if ok else 'error'} title=Server smoke test::{esc}")
          if not ok:
              raise SystemExit(1)
          PY
          grep -aqE "Done \([0-9.]+s\)! For help" server.log
          ! grep -aq "Unknown or incomplete command" server.log
          ! grep -aq "An unexpected error occurred" server.log
