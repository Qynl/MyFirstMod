name: Build Mod

on:
  push:
    branches-ignore: []
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate assets
        run: python3 tools/validate_assets.py

      # `set -o pipefail` matters: without it `| tee` would swallow Gradle's
      # exit code and a broken build would look green.
      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace --console=plain 2>&1 | tee gradle.log

      # Compiler errors are packed into a single escaped annotation (plus the
      # log tail) so a failure is readable straight through the checks API.
      - name: Report build failure
        if: failure()
        run: |
          echo "=== gradle.log (tail) ==="
          tail -n 120 gradle.log
          echo "=== jars produced ==="
          find build -name '*.jar' 2>/dev/null | head -20 || true
          python3 - <<'PY'
          import re, pathlib
          log = pathlib.Path('gradle.log').read_text(errors='replace')
          pat = re.compile(
              r"(error:|Could not resolve|Could not find|Could not download|Could not get resource"
              r"|What went wrong|Caused by:|FAILURE:|A problem occurred|BUILD FAILED)"
          )
          seen, out = set(), []
          for line in log.splitlines():
              if not pat.search(line):
                  continue
              line = line.rstrip()
              if line in seen:
                  continue
              seen.add(line)
              out.append(line)
          msg = "\n".join(out[:200]) or log[-3000:]
          msg = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f"::error title=Gradle build errors::{msg}")
          PY

      - name: Upload Gradle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log
          if-no-files-found: warn

      - name: Upload Mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fabricracers
          path: build/libs/*.jar
          if-no-files-found: error
