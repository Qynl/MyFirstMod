name: Build Ollama Player

on:
  push:
    branches: ["arena/1ce19fde-myfirstmod"]
    paths: ["ollamaplayer/**", ".github/workflows/ollamaplayer-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ollamaplayer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Build
        run: gradle build --no-daemon

      - name: Game test (headless Minecraft: companion mines a log)
        run: gradle runGametest --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ollamaplayer
          path: ollamaplayer/build/libs/*.jar
